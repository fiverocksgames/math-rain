    <rect x="39.4" y="38.6" width="3.2" height="8" rx="1.6" transform="rotate(-45 41 42.6)"/>

    <rect x="49" y="40.8" width="8" height="3" rx="1.5"/>
    <circle cx="53" cy="38.5" r="1.4"/>
    <circle cx="53" cy="46.1" r="1.4"/>
